# Local development database only. Production uses compose.yaml.
# Binds to 127.0.0.1:5433 so it does not collide with other local Postgres instances.
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe_dev
    volumes:
      - recipe_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recipe -d recipe_dev']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  recipe_dev_pgdata:
