# Local production-like run without a tunnel: publishes the app on 127.0.0.1:3000.
# Used for header/cache verification and Docker persistence tests.
#   docker compose -f compose.local-prod.yaml up -d --build
name: pantry-and-plate-local

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-recipe}:${POSTGRES_PASSWORD:-recipe-local}@db:5432/${POSTGRES_DB:-recipe}
  ORIGIN: ${ORIGIN:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-production-secret-please-change-0123456789}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
  STORAGE_BACKEND: local
  UPLOAD_DIR: /app/data/uploads
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-6M}
  PUBLIC_REVISION_POLL_MS: ${PUBLIC_REVISION_POLL_MS:-20000}
  HOST: 0.0.0.0
  PORT: '3000'

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe-local}
      POSTGRES_DB: ${POSTGRES_DB:-recipe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-recipe} -d ${POSTGRES_DB:-recipe}']
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      target: runtime
    image: pantry-and-plate:latest
    restart: 'no'
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'scripts/migrate.mjs']
  app:
    build:
      context: .
      target: runtime
    image: pantry-and-plate:latest
    restart: unless-stopped
    environment: *app-env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
