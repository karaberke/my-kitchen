# My Kitchen — production stack: PostgreSQL + one-shot migrations + app (+ optional Cloudflare Tunnel).
#
#   ./deploy.sh                     one-command setup and launch (writes .env, generates secrets)
#   docker compose up -d --build    launch/upgrade once .env exists
#
# Cloudflare Tunnel is opt-in through Compose profiles set in .env:
#   COMPOSE_PROFILES=tunnel        named tunnel with CLOUDFLARE_TUNNEL_TOKEN (your own domain)
#   COMPOSE_PROFILES=quicktunnel   zero-config https://<random>.trycloudflare.com URL (try-out only)
# The app itself listens on ${APP_BIND}:${APP_PORT} (default 127.0.0.1:3000).
name: my-kitchen

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-recipe}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-recipe}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-30}
  DATABASE_SSL: ${DATABASE_SSL:-}
  # Public URL users type. Leave empty only for the quick tunnel (origin is then taken from each request).
  ORIGIN: ${ORIGIN:-}
  PROTOCOL_HEADER: x-forwarded-proto
  HOST_HEADER: x-forwarded-host
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  UPLOAD_DIR: /app/data/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-6M}
  IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-2}
  PUBLIC_REVISION_POLL_MS: ${PUBLIC_REVISION_POLL_MS:-20000}
  HOST: 0.0.0.0
  PORT: '3000'

x-cloudflared: &cloudflared
  image: cloudflare/cloudflared:2025.9.1
  restart: unless-stopped
  depends_on:
    app:
      condition: service_started

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-recipe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-recipe} -d ${POSTGRES_DB:-recipe}']
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      target: runtime
    image: my-kitchen:latest
    restart: 'no'
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'scripts/migrate.mjs']

  app:
    build:
      context: .
      target: runtime
    image: my-kitchen:latest
    restart: unless-stopped
    environment: *app-env
    ports:
      # APP_BIND=127.0.0.1 keeps it local (tunnel / reverse proxy on the same host); 0.0.0.0 exposes it on the LAN.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  # Named tunnel for your own domain (dashboard-created, token based).
  cloudflared:
    <<: *cloudflared
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # Quick tunnel: no account, random *.trycloudflare.com hostname printed in its logs.
  quicktunnel:
    <<: *cloudflared
    profiles: [quicktunnel]
    command: tunnel --no-autoupdate --url http://app:3000

volumes:
  pgdata:
  uploads:
