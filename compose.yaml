# Production: app + PostgreSQL + one-shot migrations + Cloudflare Tunnel.
# One-time setup: copy .env.example to .env and fill in the values.
# Launch:       docker compose up -d --build
# No host ports are published; Cloudflare routes the public hostname to http://app:3000.
name: pantry-and-plate

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-recipe}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-recipe}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-30}
  DATABASE_SSL: ${DATABASE_SSL:-}
  ORIGIN: ${ORIGIN:?set ORIGIN in .env (https://your-hostname)}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  UPLOAD_DIR: /app/data/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-6M}
  IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-2}
  PUBLIC_REVISION_POLL_MS: ${PUBLIC_REVISION_POLL_MS:-20000}
  HOST: 0.0.0.0
  PORT: '3000'

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-recipe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-recipe} -d ${POSTGRES_DB:-recipe}']
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      target: runtime
    image: pantry-and-plate:latest
    restart: 'no'
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'scripts/migrate.mjs']

  app:
    build:
      context: .
      target: runtime
    image: pantry-and-plate:latest
    restart: unless-stopped
    environment: *app-env
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    # No host port: reachable only through the tunnel (and other compose services).

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
  uploads:
