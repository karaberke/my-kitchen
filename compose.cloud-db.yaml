# Same as compose.yaml but for a managed/cloud PostgreSQL: no db service.
#   ./deploy.sh --cloud-db 'postgres://user:pass@host/db'      or
#   docker compose -f compose.cloud-db.yaml up -d --build
name: my-kitchen

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-30}
  # unset -> require: verified TLS (cloud databases normally mandate it). DATABASE_SSL=no-verify
  # skips certificate checking; DATABASE_SSL= (empty) disables TLS, e.g. for a LAN database.
  DATABASE_SSL: ${DATABASE_SSL-require}
  ORIGIN: ${ORIGIN:-}
  PROTOCOL_HEADER: x-forwarded-proto
  HOST_HEADER: x-forwarded-host
  # Real client IP for auth rate limits. Set ONLY when every request arrives through the
  # tunnel/proxy (deploy.sh sets it for the tunnel profiles); a request without the header
  # would otherwise have no address. Empty = use the socket peer.
  ADDRESS_HEADER: ${ADDRESS_HEADER:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
  # First account, created on the first start when it does not exist yet.
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_NAME: ${ADMIN_NAME:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  UPLOAD_DIR: /app/data/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-6M}
  IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-2}
  PUBLIC_REVISION_POLL_MS: ${PUBLIC_REVISION_POLL_MS:-20000}
  HOST: 0.0.0.0
  PORT: '3000'

x-cloudflared: &cloudflared
  image: cloudflare/cloudflared:2025.9.1
  restart: unless-stopped
  depends_on:
    app:
      condition: service_started

services:
  migrate:
    # No build: block — see the note in compose.yaml. Two services declaring a
    # build for one image name make Compose export that image twice.
    image: my-kitchen:latest
    restart: 'no'
    environment: *app-env
    command: ['node', 'scripts/migrate.mjs']

  app:
    build:
      context: .
      target: runtime
    image: my-kitchen:latest
    restart: unless-stopped
    environment: *app-env
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3003}:3000'
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  cloudflared:
    <<: *cloudflared
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  quicktunnel:
    <<: *cloudflared
    profiles: [quicktunnel]
    command: tunnel --no-autoupdate --url http://app:3000

volumes:
  uploads:
