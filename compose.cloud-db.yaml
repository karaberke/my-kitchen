# Production variant with a managed/cloud PostgreSQL (Neon, Supabase, RDS, ...).
# Omits the local db service. DATABASE_URL and DATABASE_SSL come from .env.
# Launch:  docker compose -f compose.cloud-db.yaml up -d --build
name: pantry-and-plate

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-30}
  DATABASE_SSL: ${DATABASE_SSL:-require}
  ORIGIN: ${ORIGIN:?set ORIGIN in .env (https://your-hostname)}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  UPLOAD_DIR: /app/data/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-6M}
  IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-2}
  PUBLIC_REVISION_POLL_MS: ${PUBLIC_REVISION_POLL_MS:-20000}
  HOST: 0.0.0.0
  PORT: '3000'

services:
  migrate:
    build:
      context: .
      target: runtime
    image: pantry-and-plate:latest
    restart: 'no'
    environment: *app-env
    command: ['node', 'scripts/migrate.mjs']

  app:
    build:
      context: .
      target: runtime
    image: pantry-and-plate:latest
    restart: unless-stopped
    environment: *app-env
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_started

volumes:
  uploads:
